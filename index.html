<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armenia Real Estate Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🇦🇲 Armenia Real Estate Hub</div>
        <p>Scraped & Aggregated Listings from FB & Local Sites</p>
    </header>

    <main>
        <!-- Filter Controls -->
        <section class="filters" id="filter-container">
            <button class="filter-btn active" data-location="All">All Locations</button>
            <button class="filter-btn" data-location="Kentron / Center">Kentron</button>
            <button class="filter-btn" data-location="Arabkir">Arabkir</button>
            <button class="filter-btn" data-location="Malatia-Sebastia">Malatia-Sebastia</button>
            <button class="filter-btn" data-location="Avan">Avan</button>
        </section>

        <!-- Listings Grid -->
        <section class="listings-grid" id="listings-grid">
            <!-- Dynamic listings will be injected here automatically by script.js -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Armenia Real Estate Scraper Hub</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
